# PREPARED FILE (PF-SCOPE-016) — not active at this path.
# Land it via the GitHub web editor as: .github/workflows/eas-update.yml
# (Workflow files cannot be pushed through Lenard's connector; owner lands this once.)
#
# What it does:
# - On every push to a scope/** branch: publishes an OTA update to the `preview`
#   channel (`eas update`), so the owner's TestFlight preview build picks up
#   JS-only changes on relaunch.
# - Manual run (Actions tab → "EAS preview" → Run workflow): choose `update`
#   (same as above) or `build` (a fresh preview build for TestFlight submit).
# Requires the EXPO_TOKEN repository secret (owner set 2026-11-10).

name: EAS preview

on:
  push:
    branches:
      - "scope/**"
  workflow_dispatch:
    inputs:
      task:
        description: "What to run"
        type: choice
        options:
          - update
          - build
        default: update

jobs:
  update:
    if: github.event_name == 'push' || inputs.task == 'update'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Publish update to preview channel
        working-directory: apps/mobile
        run: eas update --channel preview --message "${{ github.sha }}" --non-interactive

  build:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'build'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: npm ci
      - name: Build preview profile (iOS)
        working-directory: apps/mobile
        run: eas build --profile preview --platform ios --non-interactive --no-wait
